<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #f4f7fb;
        overflow: hidden;
      }

      iframe {
        border: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: #f4f7fb;
      }
    </style>
  </head>
  <body>
    <iframe id="appFrame" title="app"></iframe>
    <script>
      ;(async () => {
        const params = new URLSearchParams(window.location.search)
        const screen = params.get('screen') || 'client-profile-summary'
        const uid = params.get('uid') || '5510721194'
        const width = Number.parseInt(params.get('w') || '390', 10)
        const height = Number.parseInt(params.get('h') || '844', 10)

        const appUrl = new URL('/', window.location.origin)
        appUrl.searchParams.set('tgEmu', '1')
        appUrl.searchParams.set('tgUserId', uid)
        appUrl.searchParams.set('tgTheme', 'light')
        appUrl.searchParams.set('tgPlatform', 'ios')
        appUrl.searchParams.set('tgExpanded', '1')
        appUrl.searchParams.set('tgFullscreen', '1')
        appUrl.searchParams.set('tgTopInset', '47')
        appUrl.searchParams.set('tgBottomInset', '34')
        appUrl.searchParams.set('tgLeftInset', '0')
        appUrl.searchParams.set('tgRightInset', '0')
        appUrl.searchParams.set('tgContentTopInset', '47')
        appUrl.searchParams.set('tgContentBottomInset', '34')
        appUrl.searchParams.set('tgContentLeftInset', '0')
        appUrl.searchParams.set('tgContentRightInset', '0')
        appUrl.searchParams.set('tgWidth', String(width))
        appUrl.searchParams.set('tgHeight', String(height))

        const frame = document.getElementById('appFrame')
        frame.src = appUrl.toString()

        const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms))

        const until = async (predicate, timeout = 15000, step = 150) => {
          const started = Date.now()
          while (Date.now() - started < timeout) {
            const value = predicate()
            if (value) return value
            await wait(step)
          }
          return null
        }

        const getDoc = () => frame.contentDocument

        const normalized = (value) =>
          String(value || '')
            .replace(/\s+/g, ' ')
            .trim()

        const getButtons = () => Array.from(getDoc().querySelectorAll('button'))

        const findButton = (label, exact = true) => {
          const target = normalized(label)
          return (
            getButtons().find((button) => {
              if (button.disabled) return false
              const text = normalized(button.textContent)
              if (exact) return text === target
              return text.includes(target)
            }) || null
          )
        }

        const clickButton = async (label, options = {}) => {
          const exact = options.exact !== false
          const timeout = options.timeout || 12000
          const button = await until(() => findButton(label, exact), timeout)
          if (!button) return false
          button.click()
          await wait(options.afterWait || 650)
          return true
        }

        const setInputValue = (input, value) => {
          const proto =
            input instanceof HTMLTextAreaElement
              ? HTMLTextAreaElement.prototype
              : HTMLInputElement.prototype
          const descriptor = Object.getOwnPropertyDescriptor(proto, 'value')
          descriptor?.set?.call(input, value)
          input.dispatchEvent(new Event('input', { bubbles: true }))
          input.dispatchEvent(new Event('change', { bubbles: true }))
        }

        const selectValue = (select, value) => {
          const descriptor = Object.getOwnPropertyDescriptor(
            HTMLSelectElement.prototype,
            'value'
          )
          descriptor?.set?.call(select, value)
          select.dispatchEvent(new Event('input', { bubbles: true }))
          select.dispatchEvent(new Event('change', { bubbles: true }))
        }

        const ensureAddress = async () => {
          const doc = getDoc()
          const saveButton = await until(
            () =>
              findButton('Сохранить', true) ||
              getButtons().find((button) => normalized(button.textContent).includes('Сохраняем')),
            15000
          )
          if (!saveButton) throw new Error('save button not found')

          if (saveButton.disabled) {
            const cityInput = doc.querySelector('#city-input')
            if (cityInput) {
              cityInput.focus()
              setInputValue(cityInput, 'Москва')
            }

            await wait(600)

            const suggestion =
              doc.querySelector('.suggest-item:not(.is-disabled)') ||
              doc.querySelector('.suggest-item')
            if (suggestion) {
              suggestion.dispatchEvent(
                new MouseEvent('mousedown', { bubbles: true, cancelable: true })
              )
            }

            await wait(700)

            const districtSelect = doc.querySelector('#district-select')
            if (districtSelect && districtSelect.options.length > 1) {
              selectValue(districtSelect, districtSelect.options[1].value)
            }

            await wait(600)
          }

          const saveReady = await until(() => {
            const btn =
              findButton('Сохранить', true) ||
              getButtons().find((button) => normalized(button.textContent).includes('Сохранить'))
            return btn && !btn.disabled ? btn : null
          }, 6000)

          if (!saveReady) throw new Error('save button disabled')
          saveReady.click()
          await wait(1200)
        }

        const waitForClientProfile = async () => {
          await until(() => getDoc().querySelector('.screen--client-profile'), 20000)
          await until(
            () =>
              Array.from(getDoc().querySelectorAll('h1,h2')).some((node) =>
                normalized(node.textContent).includes('Мой кабинет')
              ),
            20000
          )
          await wait(700)
        }

        const openClientProfile = async () => {
          await clickButton('Мне нужна услуга', { exact: true, timeout: 15000, afterWait: 900 })
          await until(() => getDoc().querySelector('.screen--address'), 15000)
          await wait(700)
          await ensureAddress()

          await until(() => getDoc().querySelector('.screen--client'), 20000)
          await wait(700)
          await clickButton('Профиль', { exact: true, timeout: 10000, afterWait: 900 })
          await waitForClientProfile()
        }

        const openProSettingsHub = async () => {
          await clickButton('Я мастер', { exact: true, timeout: 15000, afterWait: 1300 })
          await until(() => getDoc().querySelector('.screen--pro-profile'), 20000)
          await wait(900)

          const settingsBtn = await until(
            () => getDoc().querySelector('button[aria-label="Настройки профиля"]'),
            12000
          )
          if (!settingsBtn) throw new Error('settings button not found')
          settingsBtn.click()

          await until(() => getDoc().querySelector('.pro-profile-settings-screen'), 12000)
          await wait(700)
        }

        const openProEditor = async (sectionLabel, sectionKey) => {
          await openProSettingsHub()
          const items = Array.from(getDoc().querySelectorAll('.pro-profile-settings-item'))
          const target =
            items.find((item) => normalized(item.textContent).includes(sectionLabel)) || null
          if (!target) throw new Error(`section not found: ${sectionLabel}`)
          target.click()
          await until(
            () => getDoc().querySelector(`.pro-profile-editor-screen[data-editor-section="${sectionKey}"]`),
            12000
          )
          await wait(800)
        }

        const run = async () => {
          await until(() => getDoc() && getDoc().readyState !== 'loading', 20000)
          await wait(1400)

          switch (screen) {
            case 'client-address':
              await clickButton('Мне нужна услуга', {
                exact: true,
                timeout: 15000,
                afterWait: 900,
              })
              await until(() => getDoc().querySelector('.screen--address'), 15000)
              await wait(700)
              break

            case 'client-profile-summary':
              await openClientProfile()
              break

            case 'client-profile-activity':
              await openClientProfile()
              await clickButton('Активность', { exact: true, timeout: 10000 })
              await wait(700)
              break

            case 'client-profile-location':
              await openClientProfile()
              await clickButton('Локация', { exact: true, timeout: 10000 })
              await wait(700)
              break

            case 'client-profile-favorites':
              await openClientProfile()
              await clickButton('Избранное', { exact: true, timeout: 10000 })
              await wait(700)
              break

            case 'pro-profile-main':
              await clickButton('Я мастер', { exact: true, timeout: 15000, afterWait: 1300 })
              await until(() => getDoc().querySelector('.screen--pro-profile'), 20000)
              await wait(900)
              break

            case 'pro-settings-hub':
              await openProSettingsHub()
              break

            case 'pro-editor-media':
              await openProSettingsHub()
              {
                const mediaBtn = await until(
                  () =>
                    getButtons().find((button) =>
                      normalized(button.textContent).includes('Редактировать фото профиля')
                    ) ||
                    getDoc().querySelector(
                      'button[aria-label="Редактировать фото профиля"]'
                    ),
                  10000
                )
                if (!mediaBtn) throw new Error('media button not found')
                mediaBtn.click()
              }
              await until(
                () => getDoc().querySelector('.pro-profile-editor-screen[data-editor-section="media"]'),
                12000
              )
              await wait(800)
              break

            case 'pro-editor-basic':
              await openProEditor('О себе', 'basic')
              break

            case 'pro-editor-location':
              await openProEditor('Локация', 'location')
              break

            case 'pro-editor-availability':
              await openProEditor('График', 'availability')
              break

            case 'pro-editor-policies':
              await openProEditor('Политики и депозит', 'policies')
              break

            case 'pro-editor-services':
              await openProEditor('Услуги', 'services')
              break

            case 'pro-editor-certificates':
              await openProEditor('Сертификаты', 'certificates')
              break

            default:
              break
          }

          const doc = getDoc()
          if (doc) {
            doc.documentElement.style.scrollBehavior = 'auto'
            doc.defaultView?.scrollTo(0, 0)
            doc.querySelectorAll('.screen,.client-shell,.pro-shell,.pro-profile-editor-shell').forEach((node) => {
              if (node instanceof HTMLElement) {
                node.scrollTop = 0
                node.scrollLeft = 0
              }
            })
          }

          document.body.dataset.auditReady = '1'
          await wait(250)
        }

        try {
          await run()
        } catch (error) {
          console.error(error)
          document.body.dataset.auditReady = 'error'
        }
      })()
    </script>
  </body>
</html>
